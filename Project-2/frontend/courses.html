<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses - StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                S
            </div>

            <div class="logo-text">

                <h2>StudentHub</h2>

                <span>
                    Management System
                </span>

            </div>

        </div>


        <nav class="navigation">

            <a href="index.html" class="nav-item">

                <span class="nav-icon">
                    ▣
                </span>

                <span>
                    Dashboard
                </span>

            </a>


            <a href="students.html" class="nav-item">

                <span class="nav-icon">
                    👥
                </span>

                <span>
                    Students
                </span>

            </a>


            <a href="courses.html" class="nav-item active">

                <span class="nav-icon">
                    📚
                </span>

                <span>
                    Courses
                </span>

            </a>


            <a href="reports.html" class="nav-item">

                <span class="nav-icon">
                    📊
                </span>

                <span>
                    Reports
                </span>

            </a>


            <!-- SETTINGS -->

            <a href="settings.html" class="nav-item">

                <span class="nav-icon">
                    ⚙
                </span>

                <span>
                    Settings
                </span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="user">

                <div class="avatar">
                    B
                </div>

                <div>

                    <strong>
                        Admin
                    </strong>

                    <small>
                        Administrator
                    </small>

                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div>

                <p class="welcome">
                    Course Management
                </p>

                <h1>
                    Courses
                </h1>

            </div>


            <button
                class="notification"
                type="button"
            >
                🔔
            </button>

        </header>


        <!-- TOOLBAR -->

        <section class="student-toolbar">

            <div class="search-box">

                <span>
                    🔍
                </span>

                <input
                    type="text"
                    id="courseSearch"
                    placeholder="Search courses..."
                >

            </div>


            <button
                class="add-student-btn"
                id="addCourseBtn"
                type="button"
            >
                + Add Course
            </button>

        </section>


        <!-- COURSE TABLE -->

        <section class="panel student-panel">

            <div class="panel-header">

                <div>

                    <h2>
                        All Courses
                    </h2>

                    <p>
                        Manage available courses
                    </p>

                </div>


                <span
                    id="courseCount"
                    class="student-count"
                >
                    0 Courses
                </span>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Course
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Credits
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="coursesTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- ADD / EDIT COURSE MODAL -->

<div
    class="modal"
    id="courseModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <div>

                <h2 id="courseModalTitle">
                    Add Course
                </h2>

                <p>
                    Enter course information
                </p>

            </div>


            <button
                class="modal-close"
                id="closeCourseModal"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="courseForm">

            <input
                type="hidden"
                id="courseId"
            >


            <div class="form-group">

                <label>
                    Course Name
                </label>

                <input
                    type="text"
                    id="courseName"
                    placeholder="Data Structures"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Course Code
                    </label>

                    <input
                        type="text"
                        id="courseCode"
                        placeholder="CS201"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Credits
                    </label>

                    <input
                        type="number"
                        id="courseCredits"
                        min="1"
                        max="10"
                        value="4"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Department
                </label>

                <select
                    id="courseDepartment"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    <option value="CSE">
                        CSE
                    </option>

                    <option value="ISE">
                        ISE
                    </option>

                    <option value="ECE">
                        ECE
                    </option>

                    <option value="EEE">
                        EEE
                    </option>

                    <option value="ME">
                        Mechanical
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelCourse"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="add-student-btn"
                >
                    Save Course
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/courses.js"></script>
<script src="js/global-settings.js"></script>

</body>

</html>
